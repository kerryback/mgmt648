# Applies to every deck in slides/, so they render as reveal.js as part of the
# website build (the root _quarto.yml renders slides/*.qmd into docs/slides/).
# index.qmd and syllabus.qmd stay at the project root: a file in this folder
# cannot opt out of the revealjs format below.
#
# `theme` is deliberately NOT set here. Quarto appends a document's theme list
# to the one it inherits rather than replacing it, so a deck on a different
# theme would get both stylesheets. Each deck therefore declares its own theme
# in its front matter: session01 uses shoji2.scss, the rest use shoji.scss.
#
# width, height and margin are load bearing: each theme's grid is specified in
# px against a fixed canvas -- 1050x700 for shoji, 1280x720 for shoji2 -- and
# reveal's default 10% margin would scale that canvas by 0.9, landing every edge
# on a fractional device pixel and leaving 1px slivers of the wrong colour along
# the seams. The values below are shoji's; a shoji2 deck overrides width and
# height in its own front matter (scalars replace rather than append).
#
# Each deck's date: is the ISO class date; this renders it readably. Quarto
# silently falls back to 1 January when it cannot parse a date, so keep them ISO.
date-format: "ddd MMM D, YYYY"

format:
  revealjs:
    width: 1050
    height: 700
    margin: 0
    slide-number: c/t
    footer: "MGMT 648 &middot; Applied Finance"
    highlight-style: github
    html-math-method: mathjax
