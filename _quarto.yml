project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - syllabus.qmd
    # Decks are added here one at a time, as each is ready -- deliberately not
    # globbed as slides/*.qmd, which would publish every unwritten starter deck
    # in the folder. Uncomment a line when that date's deck is finished; it
    # renders into docs/slides/ as reveal.js (see slides/_metadata.yml).
    #
    # One deck per class date, named for the date. The two in-person Saturdays
    # each carry a single deck for the whole 2:00-6:30 afternoon.
    #
    # session10 and 11 are left over from the previous unit-numbered scheme.
    # They hold written content that needs folding into the date decks above
    # before they go.
    - slides/08-27.qmd
    - slides/09-12.qmd
    - slides/09-17.qmd
    # - slides/october01.qmd
    # - slides/october10.qmd
    # - slides/october15.qmd
    - slides/session10.qmd
    - slides/session11.qmd
    # The previous version of this course lives under archive/ and is not part
    # of the site. Excluded explicitly as well as omitted above, so a stray
    # glob added later cannot pull it back in.
    - "!archive/"

  resources:
    - CNAME
    - .nojekyll
    - under-construction.html
    # Wheel-of-fortune spinner that draws the next student to present. Hand-
    # written HTML with no dependencies, so it is copied through verbatim to
    # docs/. Anchored with a leading slash so the glob cannot also match a
    # copy of the name somewhere deeper in the tree.
    - /wheel.html
    # Four-panel explorer for the capital schedule in the September 17 deck:
    # net PP&E, its change, depreciation and capital expenditure, against a
    # depreciation-rate and a growth-scale slider. Self-contained, so copied
    # through verbatim like the spinner above.
    - /ppe-explorer.html
    # The two densities behind a lognormal: z = mu + sigma*epsilon and x = e^z,
    # with a button that draws a shock and marks it on both. Also self-contained.
    - /lognormal.html
    - images/RiceBusiness-transparent-logo-sm.png
    - images/headshot-keeper-cropped2.png
    # Session file bundles linked from the schedule's Files links.
    - files/0917.zip
    # Session material, linked from the schedule rows in index.qmd.
    #
    # The decks themselves are rendered, not copied, so they are not listed
    # here -- slides/*.qmd is in the render list above.
    #
    # These PDFs are produced by decktape (see .claude/commands/deck.md), which
    # writes pdf/<stem>.pdf and mirrors it into docs/pdf/. Listing them here is
    # what stops a later full render from dropping that mirrored copy. A file
    # that does not exist yet is skipped with a warning, so the whole term can
    # be listed up front.
    - pdf/08-27.pdf
    - pdf/09-12.pdf
    - pdf/09-17.pdf
    - pdf/session03.pdf
    - pdf/session04.pdf
    - pdf/session05.pdf
    - pdf/session06.pdf
    - pdf/session07.pdf
    - pdf/session08.pdf
    - pdf/session09.pdf
    - pdf/session10.pdf
    - pdf/session11.pdf
    - pdf/session12.pdf
    # Staging folders files/session01..12 are deliberately not published; only
    # the zip handed to the class is.
    - files/*.zip

website:
  title: ""
  search: false
  navbar:
    search: false
    title: MGMT 648
    href: index.html

format:
  html:
    theme:
      light: flatly
      dark: superhero
    link-external-newwindow: true
